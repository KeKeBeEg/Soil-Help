name: backend-run

# Step 2: run one demo case by hand on a GitHub runner.
# GitHub -> Actions -> backend-run -> Run workflow.
#
# 1. Copies both cache buckets from R2 to the runner's disk.
# 2. Runs the backend unchanged (python run.py <request>).
# 3. Uploads analysis/ and view/ to the results bucket (never inputs/).
# 4. Uploads any newly pulled data back to the cache buckets.
#
# Settings it needs (repo -> Settings -> Secrets and variables -> Actions):
#   secrets:   EE_SERVICE_ACCOUNT_JSON, R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   variables: EE_PROJECT, R2_BUCKET_RESULTS, R2_BUCKET_CACHE_US, R2_BUCKET_CACHE_GLOBAL

on:
  workflow_dispatch:
    inputs:
      case:
        description: Demo request in cases/
        type: choice
        options:
          - us_yancey_helene
          - ethiopia_gilgel_abay
        default: us_yancey_helene
      refresh:
        description: Redo the analysis even if it is up to date
        type: boolean
        default: false

permissions:
  contents: read

# One run at a time for now; step 3 replaces this with parallel slots.
concurrency:
  group: backend-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CASE: ${{ inputs.case }}
      WORK: ${{ github.workspace }}/.work
      EE_PROJECT: ${{ vars.EE_PROJECT }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET_RESULTS: ${{ vars.R2_BUCKET_RESULTS }}
      BUCKET_CACHE_US: ${{ vars.R2_BUCKET_CACHE_US }}
      BUCKET_CACHE_GLOBAL: ${{ vars.R2_BUCKET_CACHE_GLOBAL }}
      # The AWS command-line tool (preinstalled on the runner) talks to R2 through its S3 API.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the backend
        run: python -m pip install -r requirements.txt

      - name: Check settings and R2 access
        run: |
          for v in BUCKET_RESULTS BUCKET_CACHE_US BUCKET_CACHE_GLOBAL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty: check the repo's Actions secrets and variables"; exit 1; fi
          done
          for b in "$BUCKET_RESULTS" "$BUCKET_CACHE_US" "$BUCKET_CACHE_GLOBAL"; do
            aws s3 ls "s3://$b" --endpoint-url "$R2_ENDPOINT" > /dev/null \
              || { echo "::error::cannot list bucket $b: check the R2 token and its bucket access"; exit 1; }
          done
          echo "R2 reachable: all three buckets"

      # The key is written to a temporary file outside the checkout; the runner is destroyed after the job.
      # GOOGLE_APPLICATION_CREDENTIALS may already be enough for Earth Engine; if not, the backend
      # needs the small sign-in change (step 0) to read EE_SERVICE_ACCOUNT_KEY.
      - name: Earth Engine key
        env:
          EE_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$EE_KEY" ]; then
            printf '%s' "$EE_KEY" > "$RUNNER_TEMP/ee-key.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ee-key.json" >> "$GITHUB_ENV"
            echo "EE_SERVICE_ACCOUNT_KEY=$RUNNER_TEMP/ee-key.json" >> "$GITHUB_ENV"
            echo "Earth Engine key written"
          else
            echo "::warning::EE_SERVICE_ACCOUNT_JSON is empty: only fully cached fields will work"
          fi

      - name: Download caches from R2
        id: download
        run: |
          mkdir -p "$WORK/cache/us" "$WORK/cache/global"
          aws s3 sync "s3://$BUCKET_CACHE_US"     "$WORK/cache/us"     --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 sync "s3://$BUCKET_CACHE_GLOBAL" "$WORK/cache/global" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          du -sh "$WORK/cache/us" "$WORK/cache/global"

      # Same request as cases/<case>.json, with the cache and output folders pointed at the runner's disk.
      # Relative paths are resolved against the request file's folder ($WORK).
      - name: Build the request
        run: |
          jq '.us_cache = "cache/us" | .global_cache = "cache/global" | .working_save = "run"' \
            "cases/$CASE.json" > "$WORK/request.json"
          cat "$WORK/request.json"

      - name: Run the backend
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python run.py "$WORK/request.json" --refresh
          else
            python run.py "$WORK/request.json"
          fi

      - name: Upload results to R2
        run: |
          VERSION=$(jq -r .version analysis_version.json)
          RANGE=$(jq -r '.t_range | join("_")' "$WORK/request.json")
          FIELD="s3://$BUCKET_RESULTS/fields/v$VERSION/$CASE"
          VIEW="s3://$BUCKET_RESULTS/views/v$VERSION/$CASE/$RANGE"
          aws s3 cp   "$WORK/request.json"  "$FIELD/request.json" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 sync "$WORK/run/analysis"  "$FIELD/analysis"     --endpoint-url "$R2_ENDPOINT" --only-show-errors --delete
          aws s3 sync "$WORK/run/view"      "$VIEW"               --endpoint-url "$R2_ENDPOINT" --only-show-errors --delete
          {
            echo "### Uploaded"
            echo "- \`$FIELD/analysis/\`"
            echo "- \`$VIEW/\`"
            echo '```'
            aws s3 ls "$FIELD/" --recursive --human-readable --summarize --endpoint-url "$R2_ENDPOINT" | tail -2
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Runs even if the backend failed, so data pulled before the failure is kept for the next run.
      # Cache files are write-once, so --size-only uploads only files that are new.
      # .part-* files are unfinished downloads and are never uploaded.
      - name: Upload new cache files to R2
        if: always() && steps.download.outcome == 'success'
        run: |
          aws s3 sync "$WORK/cache/us"     "s3://$BUCKET_CACHE_US"     --endpoint-url "$R2_ENDPOINT" --only-show-errors --size-only --exclude "*.part-*"
          aws s3 sync "$WORK/cache/global" "s3://$BUCKET_CACHE_GLOBAL" --endpoint-url "$R2_ENDPOINT" --only-show-errors --size-only --exclude "*.part-*"
          du -sh "$WORK/cache/us" "$WORK/cache/global"
