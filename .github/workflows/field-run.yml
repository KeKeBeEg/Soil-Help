name: field-run
run-name: field ${{ inputs.field_id }} (slot ${{ inputs.slot }})

# Step 3: analyse one field, started by the submit function (step 4) or by hand.
#
# Reads   fields/v<version>/<field_id>/request.json   (GeoJSON polygon, label, optional default t_range;
#                                                      written once, never edited)
# Writes  fields/v<version>/<field_id>/status.json    (running / done / failed, for the app to poll)
#         fields/v<version>/<field_id>/analysis/      (long-term results, only when newly computed)
#         views/v<version>/<field_id>/<start>_<end>/  (the requested dates)
#         fields/v<version>/<field_id>/terrain/       (US fields: 1 m elevation for the water simulation,
#                                                      dem.tif, dem_source.tif, terrain.json)
#         fields/v<version>/<field_id>/entry.json     (this field's line in index.json)
#
# Dates to show: the t_start/t_end inputs, else the request's t_range, else the whole analysis period.
# Skips work that is already published: same field + same dates = done in seconds;
# same field + new dates = view only (2-3 s of backend work).
#
# Testing by hand: Actions -> field-run -> Run workflow, with a new field_id and
# case = us_yancey_helene or ethiopia_gilgel_abay (seeds request.json from cases/).

on:
  workflow_dispatch:
    inputs:
      field_id:
        description: Field ID (lowercase letters, digits, - and _)
        required: true
        type: string
      slot:
        description: Parallel slot, 0 to 9 (the submit function derives it from the field ID)
        required: false
        default: "0"
        type: string
      case:
        description: "Testing only: seed request.json from cases/<case>.json if the field has none"
        required: false
        default: ""
        type: string
      t_start:
        description: First day to show, YYYY-MM-DD (optional; set together with t_end)
        required: false
        default: ""
        type: string
      t_end:
        description: Last day to show, YYYY-MM-DD (optional)
        required: false
        default: ""
        type: string
      refresh:
        description: Redo the analysis even if it is published
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Runs in the same slot wait their turn (up to 100 queued); different slots run in parallel.
concurrency:
  group: field-run-slot-${{ inputs.slot }}
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FIELD_ID: ${{ inputs.field_id }}
      SLOT: ${{ inputs.slot }}
      CASE_NAME: ${{ inputs.case }}
      T_START: ${{ inputs.t_start }}
      T_END: ${{ inputs.t_end }}
      REFRESH: ${{ inputs.refresh }}
      WORK: ${{ github.workspace }}/.work
      EE_PROJECT: ${{ vars.EE_PROJECT }}
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      BUCKET_RESULTS: ${{ vars.R2_BUCKET_RESULTS }}
      BUCKET_CACHE_US: ${{ vars.R2_BUCKET_CACHE_US }}
      BUCKET_CACHE_GLOBAL: ${{ vars.R2_BUCKET_CACHE_GLOBAL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
      AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Check inputs and settings
        run: |
          if [[ ! "$FIELD_ID" =~ ^[a-z0-9][a-z0-9_-]{0,63}$ ]]; then
            echo "::error::field_id must be 1-64 lowercase letters, digits, - or _"; exit 1
          fi
          if [[ ! "$SLOT" =~ ^[0-9]$ ]]; then echo "::error::slot must be 0-9"; exit 1; fi
          for v in BUCKET_RESULTS BUCKET_CACHE_US BUCKET_CACHE_GLOBAL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty: check the repo's Actions secrets and variables"; exit 1; fi
          done
          VERSION=$(jq -r .version analysis_version.json)
          {
            echo "VERSION=$VERSION"
            echo "CLIMATE_START=$(jq -r '.climate_years[0]' analysis_version.json)"
            echo "CLIMATE_END=$(jq -r '.climate_years[1]' analysis_version.json)"
            echo "FIELD_KEY=fields/v$VERSION/$FIELD_ID"
            echo "VIEW_KEY=views/v$VERSION/$FIELD_ID"
          } >> "$GITHUB_ENV"
          mkdir -p "$WORK"

      - name: Mark running
        run: |
          source .github/scripts/r2.sh
          set_status running starting

      - name: Get the request
        id: req
        run: |
          source .github/scripts/r2.sh
          if aws s3 cp "s3://$BUCKET_RESULTS/$FIELD_KEY/request.json" "$WORK/field-request.json" \
               --endpoint-url "$R2_ENDPOINT" --only-show-errors 2> /dev/null; then
            echo "Request found in R2"
          elif [ -n "$CASE_NAME" ]; then
            if [[ ! "$CASE_NAME" =~ ^[a-z0-9_]+$ ]] || [ ! -f "cases/$CASE_NAME.json" ]; then
              echo "::error::no demo case cases/$CASE_NAME.json"; exit 1
            fi
            jq --arg id "$FIELD_ID" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              (.polygon | to_entries | sort_by(.key | tonumber) | map(.value)) as $v
              | {schema_version: 1, field_id: $id, label: .label, created_at: $now,
                 polygon: {type: "Polygon", coordinates: [$v + [$v[0]]]}, t_range: .t_range}' \
              "cases/$CASE_NAME.json" > "$WORK/field-request.json"
            r2_put_json "$FIELD_KEY/request.json" < "$WORK/field-request.json"
            echo "Request seeded from cases/$CASE_NAME.json"
          else
            echo "::error::no request.json for field $FIELD_ID (the submit function writes it; for a test, set 'case')"
            exit 1
          fi
          if ! jq -e '.polygon.type == "Polygon" and (.polygon.coordinates[0] | length) >= 4' \
                 "$WORK/field-request.json" > /dev/null; then
            echo "::error::request.json has no valid GeoJSON Polygon"; exit 1
          fi

          # Dates to show: the inputs, else the request's t_range, else the whole analysis period.
          if [ -n "$T_START" ] || [ -n "$T_END" ]; then
            START="$T_START"
            END="$T_END"
          else
            START=$(jq -r --arg d "$CLIMATE_START-01-01" '.t_range[0] // $d' "$WORK/field-request.json")
            END=$(jq -r --arg d "$CLIMATE_END-12-31" '.t_range[1] // $d' "$WORK/field-request.json")
          fi
          for d in "$START" "$END"; do
            if [[ ! "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "::error::dates must be YYYY-MM-DD, got '$d'"; exit 1; fi
          done
          if [[ "$START" > "$END" ]]; then echo "::error::t_start is after t_end"; exit 1; fi
          IN_PERIOD=false
          if [[ ! "$START" < "$CLIMATE_START-01-01" && ! "$END" > "$CLIMATE_END-12-31" ]]; then IN_PERIOD=true; fi
          echo "RANGE=${START}_${END}" >> "$GITHUB_ENV"
          echo "in_period=$IN_PERIOD" >> "$GITHUB_OUTPUT"

          # The backend's own request format; caches and output on the runner's disk.
          jq --arg id "$FIELD_ID" --arg s "$START" --arg e "$END" '
            .polygon.coordinates[0] as $r
            | {label: (.label // $id),
               polygon: (if $r[0] == $r[-1] then $r[:-1] else $r end),
               t_range: [$s, $e],
               us_cache: "cache/us", global_cache: "cache/global", working_save: "run"}' \
            "$WORK/field-request.json" > "$WORK/request.json"
          cat "$WORK/request.json"

      - name: Check what is already published
        id: pub
        run: |
          source .github/scripts/r2.sh
          ANALYSIS=false
          VIEW=false
          if [ "$REFRESH" != "true" ] && r2_exists "$FIELD_KEY/analysis/daily_series.csv" \
               && r2_exists "$FIELD_KEY/analysis/plan.json"; then
            aws s3 cp "s3://$BUCKET_RESULTS/$FIELD_KEY/analysis/plan.json" "$WORK/published-plan.json" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors
            if jq -e '(.defaults_used // []) | length == 0' "$WORK/published-plan.json" > /dev/null; then
              ANALYSIS=true
            else
              echo "The published analysis used default values: redoing it to retry the data pull"
            fi
          fi
          if [ "$ANALYSIS" = true ] && r2_exists "$VIEW_KEY/$RANGE/field_summary.json"; then VIEW=true; fi
          # US fields also publish the 1 m terrain; a field published before it existed gets it now.
          if [ "$VIEW" = true ] && [ "$(jq -r .path "$WORK/published-plan.json")" = us ] \
               && ! r2_exists "$FIELD_KEY/terrain/terrain.json"; then
            VIEW=false
            echo "The published US field has no 1 m terrain yet: building it"
          fi
          echo "analysis=$ANALYSIS" >> "$GITHUB_OUTPUT"
          echo "view=$VIEW" >> "$GITHUB_OUTPUT"
          echo "Published: analysis=$ANALYSIS, view $RANGE=$VIEW"

      - name: Already published
        if: steps.pub.outputs.view == 'true'
        run: |
          source .github/scripts/r2.sh
          set_status done "already published"
          echo "### Field \`$FIELD_ID\`: already published, nothing to do" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python 3.11
        id: py
        if: steps.pub.outputs.view != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The whole installed environment is cached, so later runs skip pip entirely.
      - name: Restore the Python environment
        id: venv
        if: steps.pub.outputs.view != 'true'
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-py${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Install the backend
        if: steps.pub.outputs.view != 'true' && steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/venv
          ~/venv/bin/python -m pip install --quiet -r requirements.txt

      - name: Use the environment
        if: steps.pub.outputs.view != 'true'
        run: echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Earth Engine key
        if: steps.pub.outputs.view != 'true'
        env:
          EE_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$EE_KEY" ]; then
            printf '%s' "$EE_KEY" > "$RUNNER_TEMP/ee-key.json"
            echo "EE_SERVICE_ACCOUNT_KEY=$RUNNER_TEMP/ee-key.json" >> "$GITHUB_ENV"
          else
            echo "::warning::EE_SERVICE_ACCOUNT_JSON is empty: only fully cached fields will work"
          fi

      - name: Download the published analysis
        if: steps.pub.outputs.view != 'true' && steps.pub.outputs.analysis == 'true'
        run: |
          aws s3 sync "s3://$BUCKET_RESULTS/$FIELD_KEY/analysis" "$WORK/run/analysis" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors
          # The published 1 m terrain (US fields), so the backend reuses it instead of pulling it again.
          aws s3 sync "s3://$BUCKET_RESULTS/$FIELD_KEY/terrain" "$WORK/run/terrain" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors

      # Needed for a new analysis, or for dates outside the analysis period (rain comes from the cache).
      - name: Download caches from R2
        id: download
        if: steps.pub.outputs.view != 'true' && (steps.pub.outputs.analysis != 'true' || steps.req.outputs.in_period != 'true')
        run: |
          source .github/scripts/r2.sh
          set_status running "loading data"
          mkdir -p "$WORK/cache/us" "$WORK/cache/global"
          aws s3 sync "s3://$BUCKET_CACHE_US"     "$WORK/cache/us"     --endpoint-url "$R2_ENDPOINT" --only-show-errors
          aws s3 sync "s3://$BUCKET_CACHE_GLOBAL" "$WORK/cache/global" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          du -sh "$WORK/cache/us" "$WORK/cache/global"

      - name: Run the backend
        if: steps.pub.outputs.view != 'true'
        run: |
          source .github/scripts/r2.sh
          if [ "${{ steps.pub.outputs.analysis }}" = "true" ]; then
            set_status running "rendering the dates"
          else
            set_status running "analysing the field"
          fi
          if [ "$REFRESH" = "true" ]; then
            python run.py "$WORK/request.json" --refresh
          else
            python run.py "$WORK/request.json"
          fi

      - name: Upload results to R2
        if: steps.pub.outputs.view != 'true'
        run: |
          source .github/scripts/r2.sh
          set_status running uploading
          if [ "${{ steps.pub.outputs.analysis }}" != "true" ]; then
            aws s3 sync "$WORK/run/analysis" "s3://$BUCKET_RESULTS/$FIELD_KEY/analysis" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors --delete
          fi
          aws s3 sync "$WORK/run/view" "s3://$BUCKET_RESULTS/$VIEW_KEY/$RANGE" \
            --endpoint-url "$R2_ENDPOINT" --only-show-errors --delete
          # US fields: the 1 m terrain. Missing when it could not be built (e.g. no Earth Engine key);
          # the backend says why in the log and the next run tries again.
          TERRAIN=""
          if [ -f "$WORK/run/terrain/terrain.json" ]; then
            aws s3 sync "$WORK/run/terrain" "s3://$BUCKET_RESULTS/$FIELD_KEY/terrain" \
              --endpoint-url "$R2_ENDPOINT" --only-show-errors --delete
            TERRAIN="$FIELD_KEY/terrain/"
          fi

          # This field's line in index.json (rebuilt by the index-rebuild workflow).
          jq --arg id "$FIELD_ID" --arg v "$VERSION" --arg range "$RANGE" --arg terrain "$TERRAIN" \
             --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --slurpfile plan "$WORK/run/analysis/plan.json" '
            .polygon.coordinates[0] as $r
            | {field_id: $id, label: (.label // $id), version: ($v | tonumber),
               data_path: $plan[0].path, climate_years: $plan[0].climate_years,
               defaults_used: ($plan[0].defaults_used // []),
               bbox: [($r | map(.[0]) | min), ($r | map(.[1]) | min),
                      ($r | map(.[0]) | max), ($r | map(.[1]) | max)],
               analysis: "fields/v\($v)/\($id)/analysis/",
               latest_view: "views/v\($v)/\($id)/\($range)/",
               terrain: (if $terrain == "" then null else $terrain end),
               updated_at: $now}' "$WORK/field-request.json" > "$WORK/entry.json"
          r2_put_json "$FIELD_KEY/entry.json" < "$WORK/entry.json"
          {
            echo "### Field \`$FIELD_ID\`"
            echo "- analysis: \`$FIELD_KEY/analysis/\` (newly computed: ${{ steps.pub.outputs.analysis != 'true' }})"
            echo "- view: \`$VIEW_KEY/$RANGE/\`"
            if [ -n "$TERRAIN" ]; then
              echo "- terrain: \`$TERRAIN\` ($(jq -r '"\(.res_m) m, lidar on \(.lidar_share_field_pct)% of the field"' "$WORK/run/terrain/terrain.json"))"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Cache files are write-once: --size-only uploads only new ones; .part-* are unfinished downloads.
      - name: Upload new cache files to R2
        if: always() && steps.download.outcome == 'success'
        run: |
          aws s3 sync "$WORK/cache/us"     "s3://$BUCKET_CACHE_US"     --endpoint-url "$R2_ENDPOINT" --only-show-errors --size-only --exclude "*.part-*"
          aws s3 sync "$WORK/cache/global" "s3://$BUCKET_CACHE_GLOBAL" --endpoint-url "$R2_ENDPOINT" --only-show-errors --size-only --exclude "*.part-*"

      - name: Mark done
        if: success() && steps.pub.outputs.view != 'true'
        run: |
          source .github/scripts/r2.sh
          set_status done finished

      - name: Mark failed
        if: failure()
        run: |
          source .github/scripts/r2.sh
          set_status failed failed "The analysis failed; the run log has the details"

      - name: Mark cancelled
        if: cancelled()
        run: |
          source .github/scripts/r2.sh
          set_status failed cancelled "The run was cancelled"
